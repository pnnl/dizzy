id: https://example.org/dizzy/topology
name: dizzy-topology-schema
title: Dizzy Deployment Topology Schema
description: >-
  LinkML meta-schema defining the structure of topology.yaml files. A topology
  says WHERE a feature's elements run — which of them share a cursor over the
  event log, how many workers serve each such group, and what carries the
  wake-up. It never says WHAT they do; that is the feature-file, and the two are
  read together by `dizzy generate wiring`.

  The unit a topology names is the CONSUMER GROUP: a set of elements sharing one
  cursor. Two workers on one group is a scaling decision. Two groups is a
  SEMANTIC decision — they advance independently and can observe each other's
  effects out of order — which is why groups are declared here, reviewed, and
  validated against the feature-file at generation time rather than discovered
  under load.

prefixes:
  linkml: https://w3id.org/linkml/
  dizzy: https://example.org/dizzy/

default_prefix: dizzy
default_range: string

imports:
  - linkml:types

classes:
  Topology:
    description: >-
      Top-level container for a deployment topology. Omitting the file entirely
      is legal and means the default topology: one group named `default` holding
      every element, in-process transport, in-memory cursors — behaviourally
      identical to a build with no topology support at all.
    attributes:
      description:
        description: What this topology is for. Free prose; it is a reviewed artifact.
        range: string
      transport:
        description: >-
          Default doorbell for every group. A group may override it. The
          transport carries "wake up, there is work" and nothing else —
          correctness comes from the cursor, so a dropped notification costs
          latency and never costs work.
        range: Transport
        inlined: true
      cursors:
        description: >-
          Where group cursors are persisted. Durable so a boot is snapshot+tail
          rather than replay-from-zero, but disposable: losing one must be safe,
          not merely recoverable.
        range: CursorStore
        inlined: true
      defaults:
        description: Settings every group inherits unless it states otherwise.
        range: GroupDefaults
        inlined: true
      groups:
        description: >-
          The declared consumer groups. Every element the feature-file declares
          must be claimed by exactly one group; generation fails if an element is
          unclaimed (and no group is `catch_all`) or claimed twice.
        range: ConsumerGroup
        multivalued: true
        inlined: true
        inlined_as_list: true

  ConsumerGroup:
    description: >-
      A set of elements sharing ONE cursor over the event log. Not "a process" —
      how many processes serve it is `workers`.
    attributes:
      name:
        description: >-
          Identifier for this group. Appears in generated wiring package names and
          in operational surfaces, never in authored element code.
        range: string
        required: true
        identifier: true
      description:
        description: Why this group exists, in deployment terms.
        range: string
      include:
        description: >-
          Which elements this group claims. Selectors are additive, and two
          groups whose selectors match the same element is a generation error —
          placement must be decided here, not by declaration order. To avoid
          enumerating the tail, mark one group `catch_all` instead.
        range: Selector
        multivalued: true
        inlined: true
        inlined_as_list: true
      catch_all:
        description: >-
          This group claims every element no other group claimed. Exactly one
          group in a topology may set it, and that group's `include` selectors
          (if any) are additive with what it sweeps up. Without this, adding an
          element to the feature-file would silently leave it unplaced — or force
          every topology to be edited in lockstep with the design.
        range: boolean
      workers:
        description: >-
          How many processes serve this group. A scaling decision, safe to change
          without re-reasoning about correctness. Defaults to 1.
        range: integer
      max_in_flight:
        description: >-
          Upper bound on units of work a single worker holds at once — the
          backpressure knob for fan-out workloads, where one command can produce
          thousands of downstream commands. Unset means unbounded.
        range: integer
      retry:
        description: What happens when an element raises.
        range: RetryPolicy
        inlined: true
      transport:
        description: Overrides the topology-level transport for this group alone.
        range: Transport
        inlined: true

  Selector:
    description: >-
      Picks elements out of the feature-file by property rather than by
      enumeration — a feature with 124 elements should not need 124 lines here.
      Within one selector the stated fields are ANDed.
    attributes:
      kind:
        description: >-
          Restrict to one element kind. Omit to match any kind a selector's other
          fields allow.
        range: ElementKind
      names:
        description: >-
          Element names, or glob patterns over them (`ingest_*`). Matched against
          the names the feature-file declares.
        range: string
        multivalued: true
      model:
        description: >-
          Match every projection that folds into this model. The convenient and
          correct way to satisfy the rule that one model's projections may never
          be split across groups.
        range: string

  RetryPolicy:
    description: >-
      Failure handling for a group. Retries are a transport-level concern and
      must not be confused with the log: a retried unit of work re-reads the same
      facts, and a permanently failed one is recorded, not silently dropped.
    attributes:
      max_attempts:
        description: Attempts before the unit is treated as failed. Defaults to 1.
        range: integer
      backoff:
        description: How the delay grows between attempts. Defaults to `none`.
        range: BackoffKind
      initial_delay_ms:
        description: Delay before the second attempt. Ignored when backoff is `none`.
        range: integer
      dead_letter:
        description: >-
          Whether a permanently failed unit is recorded for operator attention.
          Fan-out workloads need this: one bad artifact in a thousand must be
          findable without reading a log file.
        range: boolean

  Transport:
    description: >-
      The doorbell. Interchangeable by design — because correctness never rests
      on delivery, a brokerless transport and a broker are the same choice.
    attributes:
      kind:
        description: Which transport carries the wake-up.
        range: TransportKind
        required: true
      url:
        description: >-
          Connection string, when the kind needs one. Ignored by `inprocess`.
        range: string

  CursorStore:
    description: Where each group's position in the event log is persisted.
    attributes:
      kind:
        description: Which store holds cursors.
        range: CursorStoreKind
        required: true
      url:
        description: Connection string or path, when the kind needs one.
        range: string

  GroupDefaults:
    description: Values every group inherits unless it overrides them.
    attributes:
      workers:
        description: Default worker count for a group that does not state one.
        range: integer
      max_in_flight:
        description: Default in-flight bound for a group that does not state one.
        range: integer
      retry:
        description: Default retry policy for a group that does not state one.
        range: RetryPolicy
        inlined: true

enums:
  ElementKind:
    description: >-
      The element kinds a topology may place. Queries are absent deliberately:
      they are reads over a model, so their placement is a question about the
      read substrate, not about the log.
    permissible_values:
      procedures:
        description: Decide a command and record the outcome.
      policies:
        description: React to an event by dispatching a command.
      projections:
        description: Fold events into a model.

  TransportKind:
    description: Transports that can carry the doorbell.
    permissible_values:
      inprocess:
        description: >-
          In-process notification. The default, and the reason a single-group
          topology costs a consumer nothing — no broker, no daemon, no IPC.
      zmq-ipc:
        description: ZeroMQ over an ipc:// socket — brokerless, same host.
      nats:
        description: NATS subject.
      postgres-notify:
        description: Postgres LISTEN/NOTIFY, for a deployment that already runs one.
      redis:
        description: Redis pub/sub.

  CursorStoreKind:
    description: Stores that can hold group cursors.
    permissible_values:
      memory:
        description: >-
          In-memory. Every boot replays from zero, which is correct but unbounded
          in cost as the log grows. Appropriate for tests and single-shot runs.
      sqlite:
        description: A SQLite file beside the event store.
      postgres:
        description: A Postgres table, for a multi-host deployment.

  BackoffKind:
    description: How retry delay grows.
    permissible_values:
      none:
        description: Retry immediately.
      fixed:
        description: Wait `initial_delay_ms` before every attempt.
      exponential:
        description: Double the delay each attempt, starting at `initial_delay_ms`.
